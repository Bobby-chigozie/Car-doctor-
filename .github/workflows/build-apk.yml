name: Build Bobby Car Doctor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install and Setup Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm run build || npx vite build || true
          
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          
      - name: Accept Android licenses
        run: |
          yes | sudo sdkmanager --licenses || true
          sudo sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          
      - name: Create Android Project Fresh
        run: |
          rm -rf android
          npx cap init "Bobby Car Doctor" com.bobby.cardoctor --web-dir=dist || npx cap init "Bobby Car Doctor" com.bobby.cardoctor --web-dir=build || npx cap init "Bobby Car Doctor" com.bobby.cardoctor --web-dir=.
          npx cap add android
          npx cap copy android
          npx cap sync android
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload Bobby Car Doctor APK
        uses: actions/upload-artifact@v4
        with:
          name: Bobby-Car-Doctor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          