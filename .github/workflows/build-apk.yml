name: Build Bobby Car Doctor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare offline web app and runtime diagnostics
        run: node patch.js prepare

      - name: Verify Capacitor configuration
        run: |
          node -e "const c=require('./capacitor.config.json'); if(c.appId!=='com.aicardoctor.app') throw new Error('Unexpected appId: '+c.appId); if(c.webDir!=='www') throw new Error('Expected webDir www'); console.log(c)"

      - name: Create or update Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node patch.js android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bobby-Car-Doctor-APK-Diagnostics
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
